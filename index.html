<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Clases y Colas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Visualización en tiempo real -->
    <header>
      <h1 id="classNameDisplay">Cargando clase...</h1>
      <span class="badge" id="statusBadge">Conectado</span>
    </header>

    <main>
      <section class="queue-section">
        <h2>Lista de Espera Actual</h2>
        <ul id="queueContainer">
          <!-- Los elementos de la cola se inyectarán aquí asíncronamente -->
        </ul>
      </section>

      <!-- Panel de Control / Formulario de Envío -->
      <section class="control-section">
        <h2>Panel de Control</h2>
        <form id="updateForm">
          <div class="form-group">
            <label for="classNameInput">Modificar Nombre de Clase:</label>
            <input type="text" id="classNameInput" placeholder="Ej. Matemáticas Avanzadas">
          </div>
          
          <div class="form-group">
            <label for="groupInput">Añadir Número de Grupo a la Cola:</label>
            <input type="number" id="groupInput" placeholder="Ej. 4">
          </div>

          <button type="submit" id="submitBtn">Actualizar en Sheets</button>
        </form>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
